version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: ecommerce-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce-network

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    networks:
      - ecommerce-network

  # Application Services
  api-gateway:
    build: ./apps/api-gateway
    container_name: ecommerce-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - GATEWAY_PORT=3000
      - JWT_SECRET=your-development-secret-key
      - JWT_EXPIRATION=24h
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
      - CORS_ORIGIN=*
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  user-service:
    build: ./apps/user-service
    container_name: ecommerce-user-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - USER_SERVICE_PORT=3001
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/ecommerce_users?authSource=admin
      - JWT_SECRET=your-development-secret-key
      - JWT_EXPIRATION=24h
    depends_on:
      - mongodb
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  product-service:
    build: ./apps/product-service
    container_name: ecommerce-product-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PRODUCT_SERVICE_PORT=3002
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/ecommerce_products?authSource=admin
    depends_on:
      - mongodb
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  order-service:
    build: ./apps/order-service
    container_name: ecommerce-order-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - ORDER_SERVICE_PORT=3003
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/ecommerce_orders?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
    depends_on:
      - mongodb
      - redis
      - user-service
      - product-service
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  inventory-service:
    build: ./apps/inventory-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - INVENTORY_SERVICE_PORT=3005
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/ecommerce_inventory?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PRODUCT_SERVICE_URL=http://product-service:3002
    depends_on:
      - mongodb
      - redis
      - product-service
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2

  email-service:
    build: ./apps/email-service
    container_name: ecommerce-email-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=development
      - EMAIL_SERVICE_PORT=3006
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-your_sendgrid_api_key_here}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@ecommerce.com}
    depends_on:
      - redis
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  notification-service:
    build: ./apps/notification-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - NOTIFICATION_SERVICE_PORT=3004
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RESEND_API_KEY=${RESEND_API_KEY:-re_xxxxxxxxxxxxxxxxxx}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@yourdomain.com}
      - FROM_NAME=${FROM_NAME:-Ecommerce Platform}
    depends_on:
      - redis
      - email-service
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 3

volumes:
  mongodb_data:

networks:
  ecommerce-network:
    driver: bridge

