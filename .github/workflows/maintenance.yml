name: Scheduled Maintenance

on:
  schedule:
    # Run every Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  # Dependency Updates
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Update dependencies
        run: |
          echo "Checking for dependency updates..."
          bun update --dry-run
          
      - name: Security audit
        run: |
          echo "Running security audit..."
          bun audit

  # Docker Image Cleanup
  cleanup-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clean up Docker cache
        run: |
          echo "Cleaning up Docker cache..."
          docker system prune -f
          docker builder prune -f

  # Performance Monitoring
  performance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check bundle sizes
        run: |
          echo "Checking bundle sizes..."
          for service in apps/*/; do
            if [ -f "$service/package.json" ]; then
              echo "Checking $service bundle size..."
              cd "$service"
              if grep -q '"build"' package.json; then
                bun run build
                echo "Build completed for $service"
              fi
              cd - > /dev/null
            fi
          done

  # Documentation Check
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check documentation
        run: |
          echo "Checking documentation..."
          if [ -f "README.md" ]; then
            echo "✅ README.md exists"
          else
            echo "❌ README.md missing"
          fi
          
          if [ -d "docs" ]; then
            echo "✅ docs/ directory exists"
            ls -la docs/
          else
            echo "❌ docs/ directory missing"
          fi

  # Generate Maintenance Report
  maintenance-report:
    runs-on: ubuntu-latest
    needs: [update-dependencies, cleanup-docker, performance-check, docs-check]
    if: always()
    steps:
      - name: Generate Report
        run: |
          echo "## 🔧 Weekly Maintenance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Task | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Updates | ${{ needs.update-dependencies.result == 'success' && '✅ Completed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Cleanup | ${{ needs.cleanup-docker.result == 'success' && '✅ Completed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Check | ${{ needs.performance-check.result == 'success' && '✅ Completed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation Check | ${{ needs.docs-check.result == 'success' && '✅ Completed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "- Review any failed checks" >> $GITHUB_STEP_SUMMARY
          echo "- Update dependencies if needed" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor performance metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Keep documentation up to date" >> $GITHUB_STEP_SUMMARY
