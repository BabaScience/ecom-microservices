name: Pull Request Validation

on:
  pull_request:
    branches: [ main, dev ]
    types: [opened, synchronize, reopened]

jobs:
  # Validate PR
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for TODO/FIXME comments
        run: |
          echo "Checking for TODO/FIXME comments..."
          if grep -r "TODO\|FIXME" apps/ --include="*.ts" --include="*.js"; then
            echo "⚠️ Found TODO/FIXME comments. Consider addressing them before merging."
          else
            echo "✅ No TODO/FIXME comments found."
          fi

      - name: Check for console.log statements
        run: |
          echo "Checking for console.log statements..."
          if grep -r "console\.log" apps/ --include="*.ts" --include="*.js"; then
            echo "⚠️ Found console.log statements. Consider removing them for production."
          else
            echo "✅ No console.log statements found."
          fi

      - name: Validate Docker Compose
        run: |
          echo "Validating docker-compose.yml..."
          docker-compose config

      - name: Check service dependencies
        run: |
          echo "Checking service dependencies..."
          for service in apps/*/; do
            if [ -f "$service/package.json" ]; then
              echo "Checking $service..."
              cd "$service"
              bun install --dry-run
              cd - > /dev/null
            fi
          done

      - name: Security audit
        run: |
          echo "Running security audit..."
          bun audit || echo "⚠️ Security vulnerabilities found. Please review and update dependencies."
          echo "Continuing with PR validation..."

  # Run tests
  test-services:
    runs-on: ubuntu-latest
    needs: validate-pr
    strategy:
      matrix:
        service: [api-gateway, user-service, product-service, order-service, inventory-service, email-service, notification-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test ${{ matrix.service }}
        run: |
          cd apps/${{ matrix.service }}
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            echo "Running tests for ${{ matrix.service }}..."
            bun test
          else
            echo "No tests configured for ${{ matrix.service }}"
          fi

  # Build Docker images (without pushing)
  build-docker:
    runs-on: ubuntu-latest
    needs: test-services
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api-gateway/Dockerfile
          push: false
          tags: api-gateway:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build User Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/user-service/Dockerfile
          push: false
          tags: user-service:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Product Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/product-service/Dockerfile
          push: false
          tags: product-service:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Order Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/order-service/Dockerfile
          push: false
          tags: order-service:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Inventory Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/inventory-service/Dockerfile
          push: false
          tags: inventory-service:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Email Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/email-service/Dockerfile
          push: false
          tags: email-service:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Notification Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/notification-service/Dockerfile
          push: false
          tags: notification-service:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Security scan for PR
  security-scan-pr:
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: api-gateway:pr-${{ github.event.number }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # PR Summary
  pr-summary:
    runs-on: ubuntu-latest
    needs: [validate-pr, test-services, build-docker, security-scan-pr]
    if: always()
    steps:
      - name: PR Summary
        run: |
          echo "## 🚀 Pull Request Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Validation | ${{ needs.validate-pr.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test-services.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.build-docker.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan-pr.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Review any failed checks above" >> $GITHUB_STEP_SUMMARY
          echo "- Address any security vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- Ensure all tests pass" >> $GITHUB_STEP_SUMMARY
          echo "- Ready for review and merge! 🎉" >> $GITHUB_STEP_SUMMARY
